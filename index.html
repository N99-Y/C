<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบงานและคะแนน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: #dbeafe; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .app-container { width: 100%; max-width: 480px; background-color: #fff; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; border-radius: 24px; margin: 15px; min-height: 95vh; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .app-container { max-width: 95vw; zoom: 1.1; margin: 20px 0; } }
        
        .page { display: none !important; flex-direction: column; flex: 1; } 
        .page.active { display: flex !important; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        .hamburger-btn { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; color: #4a5568; z-index: 100; background: none; border: none; padding: 5px; }
        .menu-dropdown { display: none; position: absolute; top: 60px; left: 20px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 12px; padding: 10px; z-index: 999; min-width: 180px; }
        .menu-dropdown button { background: none; border: none; padding: 10px 15px; font-size: 14px; width: 100%; text-align: left; cursor: pointer; border-radius: 8px; color: #2b6cb0; font-weight: 600; }
        .menu-dropdown button:hover { background: #f3f6fc; }
        
        .login-wrapper { padding: 50px 30px; background: #fff; align-items: center; width: 100%; justify-content: center; }
        .icon-box { width: 85px; height: 85px; border-radius: 22px; display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(43, 108, 176, 0.2); }
        .icon-student { background: linear-gradient(135deg, #4da3ff 0%, #2b6cb0 100%); }
        .icon-admin { background: linear-gradient(135deg, #f6ad55 0%, #dd6b20 100%); box-shadow: 0 10px 20px rgba(221, 107, 32, 0.2); }
        .login-title { text-align: center; margin-bottom: 25px; } 
        .login-title h1 { font-size: 18px; color: #1a202c; font-weight: 700; line-height: 1.4; } 
        .login-title p { font-size: 13px; color: #718096; margin-top: 5px; }
        
        .form-group { width: 100%; margin-bottom: 15px; position: relative; text-align: left; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #4a5568; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 45px 14px 16px; border: 1px solid #bfdbfe !important; border-radius: 12px; font-size: 15px; background-color: #f8fafc !important; color: #1e293b; outline: none; }
        .toggle-password { position: absolute; right: 15px; top: 38px; cursor: pointer; font-size: 18px; color: #94a3b8; user-select: none; } 
        
        .btn-submit { width: 100%; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-student { background: linear-gradient(135deg, #4299e1 0%, #2b6cb0 100%); }
        .btn-admin { background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%); }
        
        .dashboard-wrapper { background-color: #f3f6fc; min-height: 100vh; padding-bottom: 30px; flex: 1; display: flex; flex-direction: column; }
        .header { color: white; padding: 25px 20px 35px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; margin-bottom: 20px; position: relative; }
        .header-student { background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%); }
        .header-admin { background: linear-gradient(135deg, #dd6b20 100%, #c05621 100%); }
        
        .btn-logout { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.3); padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; z-index: 10; }
        .header h2 { font-size: 18px; margin: 5px 0 5px 0; padding-right: 70px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; margin-top: -30px; position: relative; z-index: 5; }
        .stat-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); } 
        
        .work-list-section { padding: 0 20px; flex: 1; } 
        .work-card { background: white; border-radius: 15px; padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .work-item { padding: 14px 0; border-bottom: 1px solid #edf2f7; display: flex; align-items: center; justify-content: space-between; } 
        .work-item:last-child { border-bottom: none; }
        .work-number { font-weight: 700; color: #cbd5e1; width: 45px; font-size: 15px; } 
        .work-name { color: #2d3748; font-size: 14px; flex: 1; padding-right: 10px; font-weight: 500; }
        
        .btn-action { background: #dcfce7; color: #16a34a; border: none; padding: 10px 15px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15); }
        .btn-excel { background: #e0f2fe; color: #0284c7; }
        .btn-danger { background: #fee2e2; color: #ef4444; }

        /* สไตล์ตารางเมทริกซ์สำหรับ Admin */
        .matrix-container { background: white; border-radius: 16px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); overflow-x: auto; margin-top: 10px; }
        .matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        .matrix-table th, .matrix-table td { border: 1px solid #e2e8f0; padding: 8px 6px; white-space: nowrap; }
        .matrix-table th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        .matrix-table td.student-name { text-align: left; max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .matrix-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #22c55e; }

        .room-filter-bar { padding: 0 20px; display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .room-select { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; font-family: 'Prompt', sans-serif; background: white; font-weight: 600; color: #1e293b; outline: none; flex: 1; }

        .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 20px !important; }
        .swal2-input { border-radius: 10px !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- หน้าล็อกอินนักเรียน -->
        <div id="page-login-student" class="page active login-wrapper">
            <button type="button" class="hamburger-btn" onclick="toggleMenu('menu-student')">☰</button>
            <div class="menu-dropdown" id="menu-student"><button type="button" onclick="switchToAdminLogin()">👨‍🏫 เข้าสู่ระบบ Admin</button></div>
            <div class="icon-box icon-student">🎓</div>
            <div class="login-title"><h1>ระบบตรวจสอบงานและคะแนน</h1><p>สำหรับนักเรียน</p></div>
            <form onsubmit="handleLogin(event, 'student')" style="width: 100%;">
                <div class="form-group"><label>เลขประจำตัวนักเรียน</label><input type="text" id="stu-user" placeholder="กรอกเลข 5 หลัก" required inputmode="numeric" oninput="validateNumber(this)"></div>
                <div class="form-group"><label>PIN 4 หลัก</label><input type="password" id="stu-pass" placeholder="กรอก PIN 4 หลัก" required inputmode="numeric" oninput="validateNumber(this)"><span class="toggle-password" onclick="togglePasswordVisibility('stu-pass')">👁️</span></div>
                <button type="submit" class="btn-submit btn-student" id="btn-login-stu">เข้าสู่ระบบ</button>
            </form>
        </div>

        <!-- หน้าล็อกอิน Admin -->
        <div id="page-login-admin" class="page login-wrapper">
            <button type="button" class="hamburger-btn" onclick="toggleMenu('menu-admin')">☰</button>
            <div class="menu-dropdown" id="menu-admin"><button type="button" onclick="switchToStudentLogin()">🎓 สลับเป็นหน้านักเรียน</button></div>
            <div class="icon-box icon-admin">🔐</div>
            <div class="login-title"><h1>เข้าสู่ระบบจัดการ</h1><p>สำหรับครู (Admin)</p></div>
            <form onsubmit="handleLogin(event, 'admin')" style="width: 100%;">
                <div class="form-group"><label>เลขประจำตัวครู</label><input type="text" id="adm-user" placeholder="กรอกเลข 5 หลัก" required inputmode="numeric" oninput="validateNumber(this)"></div>
                <div class="form-group"><label>รหัสผ่าน</label><input type="password" id="adm-pass" placeholder="กรอก PIN 4 หลัก" required inputmode="numeric" oninput="validateNumber(this)"><span class="toggle-password" onclick="togglePasswordVisibility('adm-pass')">👁️</span></div>
                <button type="submit" class="btn-submit btn-admin" id="btn-login-adm">เข้าสู่ระบบ Admin</button>
            </form>
        </div>

        <!-- แดชบอร์ดนักเรียน -->
        <div id="page-dashboard-student" class="page dashboard-wrapper">
            <div class="header header-student">
                <button type="button" class="btn-logout" onclick="logout()">ออกจากระบบ</button>
                <div style="width:100%">
                    <p style="font-size:12px; opacity:0.9;">สวัสดี 👋</p>
                    <h2 id="stu-name-display">กำลังโหลด...</h2>
                    <div id="stu-info-display" style="font-size:11px; opacity:0.8;"></div>
                </div>
            </div>
            <div style="padding: 0 20px; margin-top:-10px; margin-bottom: 25px;">
                <div style="background: white; padding: 12px 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:600; color:#4a5568;"><span>ความคืบหน้า</span><span id="stu-progress-text">0%</span></div>
                    <div style="background: #edf2f7; border-radius: 10px; height: 8px; overflow: hidden;">
                        <div id="stu-progress" style="background: linear-gradient(90deg, #48bb78, #38a169); width: 0%; height: 100%; transition: width 1s;"></div>
                    </div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div style="width: 30px; height: 30px; border-radius: 8px; background: #e6fffa; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px;">✅</div><p style="font-size: 11px; color: #718096;">ส่งแล้ว</p><h3 id="stu-submitted-display" style="font-size: 16px; color:#22c55e;">0 งาน</h3></div>
                <div class="stat-card"><div style="width: 30px; height: 30px; border-radius: 8px; background: #fff5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px;">📌</div><p style="font-size: 11px; color: #718096;">ค้างส่ง</p><h3 style="color: #ef4444; font-size: 16px;" id="stu-pending-display">0 งาน</h3></div>
            </div>
            <div class="work-list-section" style="margin-top: 20px;"><div style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color:#1e293b;">📋 รายการงานทั้งหมด</div><div class="work-card" id="stu-task-list"></div></div>
        </div>

        <!-- หน้าจัดการของครู (Matrix Table รายห้อง) -->
        <div id="page-admin-matrix" class="page dashboard-wrapper">
            <div class="header header-admin">
                <button type="button" class="btn-logout" onclick="logout()">ออกจากระบบ</button>
                <div style="width:100%"><p style="font-size:12px; opacity:0.9;">ระบบจัดการงานและคะแนน</p><h2>สมุดเช็คงานรายห้อง</h2></div>
            </div>
            
            <!-- แถบเลือกห้องและปุ่มจัดการด่วน -->
            <div class="room-filter-bar">
                <select id="room-selector" class="room-select" onchange="renderMatrixTable()">
                    <option value="">-- เลือกห้องเรียน --</option>
                </select>
            </div>

            <div style="padding: 0 20px; display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                <button type="button" class="btn-action" onclick="addRoomTask()">➕ เพิ่มงานใหม่ให้ห้องนี้</button>
                <button type="button" class="btn-action btn-excel" onclick="triggerExcelImport()">📥 นำเข้า Excel</button>
                <button type="button" class="btn-action btn-danger" onclick="deleteSelectedRoomStudents()">🗑️ ลบนักเรียนทั้งห้องนี้</button>
                <input type="file" id="excel-upload" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(event)">
            </div>

            <div class="work-list-section" style="padding-bottom: 20px;">
                <div class="matrix-container" id="matrix-container-wrapper">
                    <p style="text-align: center; color: #64748b; padding: 20px;">กรุณาเลือกห้องเรียนด้านบน</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cfg = {apiKey:"AIzaSyDlFBaXhENWdTxexBIujLPzI4E8y6suzP0",authDomain:"page-computer.firebaseapp.com",projectId:"page-computer",storageBucket:"page-computer.firebasestorage.app",messagingSenderId:"899982510120",appId:"1:899982510120:web:872a2819279563ecce0d1d",databaseURL:"https://page-computer-default-rtdb.asia-southeast1.firebasedatabase.app"};
        firebase.initializeApp(cfg);
        const db = firebase.database();
        let sData = {}, aData = {}, logStu = null, selectedRoom = "";
        
        document.getElementById('btn-login-stu').innerText = "กำลังเชื่อมต่อ...";
        
        db.ref('schoolData').on('value', s => {
            let d = s.val();
            if(d){
                sData = d;
                for(let i in sData){
                    if(!sData[i].tasks) sData[i].tasks = [];
                    sData[i].tasks.forEach(t => { if(t.completed === undefined) t.completed = !1; });
                    sData[i].submitted = sData[i].tasks.filter(t => t.completed).length;
                    sData[i].pending = sData[i].tasks.length - sData[i].submitted;
                }
            } else { sData = {}; }
            document.getElementById('btn-login-stu').innerText = "เข้าสู่ระบบ";
            if(document.getElementById('page-admin-matrix').classList.contains('active')){
                updateRoomSelector();
                renderMatrixTable();
            }
            if(logStu && document.getElementById('page-dashboard-student').classList.contains('active')) renderStuDash(logStu);
        });

        db.ref('admins').on('value', s => { let d = s.val(); if(d) aData = d; else aData = {}; });
        
        function saveData() { db.ref('schoolData').set(sData); }
        function toggleMenu(m) { let e = document.getElementById(m); e.style.display = e.style.display === 'block' ? 'none' : 'block'; document.querySelectorAll('.menu-dropdown').forEach(x => { if(x.id !== m) x.style.display = 'none'; }); }
        function togglePasswordVisibility(i) { let p = document.getElementById(i); p.type = p.type === 'password' ? 'text' : 'password'; }
        function switchToAdminLogin() { document.getElementById('menu-student').style.display = 'none'; goToPage('page-login-admin', !0); }
        function switchToStudentLogin() { document.getElementById('menu-admin').style.display = 'none'; goToPage('page-login-student', !0); }
        
        function goToPage(p, top = !0) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            let page = document.getElementById(p);
            page.classList.remove('active');
            void page.offsetWidth; 
            page.classList.add('active');
            document.querySelectorAll('.menu-dropdown').forEach(m => m.style.display = 'none');
            if(top) window.scrollTo({top: 0, behavior: 'smooth'});
        }
        
        function validateNumber(i) { i.value = i.value.replace(/[^0-9]/g, ''); }
        
        function logout() {
            Swal.fire({title:'ออกจากระบบ?', icon:'question', showCancelButton:true, confirmButtonText:'ใช่, ออกเลย', confirmButtonColor:'#3085d6', cancelButtonText:'ยกเลิก'}).then(r => {
                if(r.isConfirmed){
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    document.getElementById('stu-pass').type = 'password';
                    document.getElementById('adm-pass').type = 'password';
                    logStu = null; selectedRoom = ""; goToPage('page-login-student', !0);
                }
            });
        }
        
        function handleLogin(e, t) {
            e.preventDefault();
            if(t === 'student'){
                let u = document.getElementById('stu-user').value, p = document.getElementById('stu-pass').value;
                if(sData[u] && sData[u].pin === p){ logStu = u; renderStuDash(u); goToPage('page-dashboard-student', !0); }
                else Swal.fire({icon:'error', title:'ผิดพลาด', text:'เลขประจำตัวหรือ PIN ไม่ถูกต้อง!'});
            } else {
                let u = document.getElementById('adm-user').value, p = document.getElementById('adm-pass').value;
                if(aData[u] && aData[u].pin === p){ 
                    updateRoomSelector();
                    goToPage('page-admin-matrix', !0); 
                }
                else Swal.fire({icon:'error', title:'ผิดพลาด', text:'รหัส Admin ไม่ถูกต้อง!'});
            }
        }
        
        function renderStuDash(id) {
            let d = sData[id]; if(!d) return;
            document.getElementById('stu-name-display').innerText = d.name;
            document.getElementById('stu-info-display').innerText = d.info + ` • เลขประจำตัว ${id}`;
            document.getElementById('stu-submitted-display').innerText = `${d.submitted} งาน`;
            document.getElementById('stu-pending-display').innerText = `${d.pending} งาน`;
            let total = d.submitted + d.pending;
            let percent = total === 0 ? 0 : Math.round((d.submitted / total) * 100);
            
            setTimeout(() => {
                document.getElementById('stu-progress').style.width = percent + '%';
                document.getElementById('stu-progress-text').innerText = `${percent}%`;
            }, 300);
            
            if(percent === 100 && total > 0) {
                setTimeout(() => confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 }, colors: ['#22c55e', '#3b82f6', '#f59e0b'] }), 600);
            }

            let l = document.getElementById('stu-task-list'); l.innerHTML = '';
            d.tasks.forEach(t => {
                l.innerHTML += `<div class="work-item"><div class="work-number">${t.w}</div><div class="work-name">${t.text}</div><div style="font-size:18px;">${t.completed ? '✅' : '⏳'}</div></div>`;
            });
        }
        
        // แยกชื่อห้องจากฟิลด์ info (เช่น "ม.1/14 • เลขที่ 6" -> ได้ "ม.1/14")
        function extractRoom(info) {
            if(!info) return "ทั่วไป";
            let parts = info.split('•');
            let roomPart = parts[0].trim();
            return roomPart ? roomPart : "ทั่วไป";
        }

        function updateRoomSelector() {
            let selector = document.getElementById('room-selector');
            let rooms = new Set();
            for(let id in sData){
                rooms.add(extractRoom(sData[id].info));
            }
            let currentVal = selector.value;
            selector.innerHTML = '<option value="">-- เลือกห้องเรียน --</option>';
            rooms.forEach(r => {
                selector.innerHTML += `<option value="${r}">${r}</option>`;
            });
            if(rooms.has(currentVal)) {
                selector.value = currentVal;
            } else if(rooms.size > 0 && !selectedRoom) {
                let firstRoom = Array.from(rooms)[0];
                selector.value = firstRoom;
                selectedRoom = firstRoom;
            } else {
                selector.value = selectedRoom;
            }
        }

        function renderMatrixTable() {
            let selector = document.getElementById('room-selector');
            selectedRoom = selector.value;
            let container = document.getElementById('matrix-container-wrapper');
            
            if(!selectedRoom){
                container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">กรุณาเลือกห้องเรียนด้านบน</p>';
                return;
            }

            // กรองนักเรียนเฉพาะห้องที่เลือก
            let studentsInRoom = [];
            for(let id in sData){
                if(extractRoom(sData[id].info) === selectedRoom){
                    studentsInRoom.push(sData[id]);
                }
            }

            if(studentsInRoom.length === 0){
                container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">ไม่พบนักเรียนในห้องนี้</p>';
                return;
            }

            // หาโครงสร้างงานจากนักเรียนคนแรกในห้องเป็นแม่แบบ
            let sampleTasks = studentsInRoom[0].tasks || [];

            let html = `<table class="matrix-table">
                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th style="text-align:left;">ชื่อ - สกุล</th>`;
            sampleTasks.forEach((t, idx) => {
                html += `<th>${t.w}<br><span style="font-size:10px; font-weight:normal; color:#64748b;" title="${t.text}">${t.text.substring(0,6)}..</span></th>`;
            });
            html += `</tr></thead><tbody>`;

            studentsInRoom.forEach((stu, index) => {
                html += `<tr>
                    <td>${index + 1}</td>
                    <td class="student-name">${stu.name}</td>`;
                
                sampleTasks.forEach((t, tIdx) => {
                    // เช็คว่านักเรียนคนนี้ส่งงานนี้หรือยัง
                    let taskObj = stu.tasks && stu.tasks[tIdx] ? stu.tasks[tIdx] : {completed: false};
                    let isChecked = taskObj.completed ? 'checked' : '';
                    html += `<td><input type="checkbox" class="matrix-checkbox" ${isChecked} onchange="toggleMatrixTask('${stu.id}', ${tIdx}, this.checked)"></td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // เมื่อครูติ๊กถูกในตารางเมทริกซ์
        function toggleMatrixTask(stuId, taskIndex, isCompleted) {
            let stu = sData[stuId];
            if(!stu || !stu.tasks[taskIndex]) return;
            
            stu.tasks[taskIndex].completed = isCompleted;
            stu.submitted = stu.tasks.filter(t => t.completed).length;
            stu.pending = stu.tasks.length - stu.submitted;
            
            saveData();
        }

        // เพิ่มงานใหม่ให้ทุกคนในห้องที่เลือกทันที
        async function addRoomTask() {
            if(!selectedRoom){
                return Swal.fire('แจ้งเตือน', 'กรุณาเลือกห้องเรียนก่อนเพิ่มงาน', 'warning');
            }

            const { value: taskName } = await Swal.fire({
                title: `➕ เพิ่มงานใหม่ให้ห้อง ${selectedRoom}`,
                input: 'text',
                inputPlaceholder: 'ระบุชื่อชิ้นงาน (เช่น งานที่ 1: วาดภาพ)',
                showCancelButton: true,
                confirmButtonText: 'เพิ่มงาน',
                confirmButtonColor: '#22c55e',
                cancelButtonText: 'ยกเลิก'
            });

            if(taskName && taskName.trim()){
                let count = 0;
                for(let id in sData){
                    if(extractRoom(sData[id].info) === selectedRoom){
                        if(!sData[id].tasks) sData[id].tasks = [];
                        let nextW = `W${sData[id].tasks.length + 1}`;
                        sData[id].tasks.push({ w: nextW, text: taskName.trim(), completed: false });
                        sData[id].submitted = sData[id].tasks.filter(t => t.completed).length;
                        sData[id].pending = sData[id].tasks.length - sData[id].submitted;
                        count++;
                    }
                }
                saveData();
                Swal.fire({icon: 'success', title: 'เพิ่มงานสำเร็จ!', text: `เพิ่มงานให้เด็กๆ ห้อง ${selectedRoom} จำนวน ${count} คนเรียบร้อย`, timer: 1500, showConfirmButton: false});
                renderMatrixTable();
            }
        }

        // ลบนักเรียนทั้งห้อง
        function deleteSelectedRoomStudents() {
            if(!selectedRoom) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกห้องเรียนก่อน', 'warning');
            
            Swal.fire({
                title: `⚠️ ลบนักเรียนทั้งห้อง ${selectedRoom}?`,
                text: 'ข้อมูลนักเรียนทั้งหมดในห้องนี้จะถูกลบถาวร!',
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'ลบทั้งหมด',
                cancelButtonText: 'ยกเลิก'
            }).then(r => {
                if(r.isConfirmed){
                    for(let id in sData){
                        if(extractRoom(sData[id].info) === selectedRoom){
                            delete sData[id];
                        }
                    }
                    saveData();
                    selectedRoom = "";
                    updateRoomSelector();
                    renderMatrixTable();
                    Swal.fire({icon: 'success', title: 'ลบเรียบร้อย', timer: 1000, showConfirmButton: false});
                }
            });
        }

        // นำเข้า Excel (รองรับทั้งแบบมีหัวข้อหรือข้อมูลเริ่มบรรทัดแรก)
        function triggerExcelImport() {
            Swal.fire({
                title: '📥 นำเข้าข้อมูลนักเรียนจาก Excel',
                html: `<div style="text-align:left; font-size:14px;">
                        สร้างไฟล์ Excel โดยมี 4 คอลัมน์:<br><br>
                        <b>คอลัมน์ A:</b> เลขประจำตัว<br>
                        <b>คอลัมน์ B:</b> PIN 4 หลัก (รหัสผ่าน)<br>
                        <b>คอลัมน์ C:</b> ชื่อ-นามสกุล<br>
                        <b>คอลัมน์ D:</b> ข้อมูลห้อง (เช่น ม.1/1 เลขที่ 1)
                       </div>`,
                icon: 'info', showCancelButton: true, confirmButtonText: 'เลือกไฟล์ Excel', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#0284c7'
            }).then((result) => { if (result.isConfirmed) document.getElementById('excel-upload').click(); });
        }

        function importExcel(e) {
            let file = e.target.files[0];
            if(!file) return;
            Swal.fire({title: 'กำลังนำเข้า...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            let reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    let data = new Uint8Array(evt.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});
                    let sheet = workbook.Sheets[workbook.SheetNames[0]];
                    let rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
                    let count = 0;
                    
                    for(let i=0; i<rows.length; i++){
                        let row = rows[i];
                        if(!row || row.length === 0 || !row[0]) continue;
                        let id = String(row[0]).trim();
                        // ข้ามแถวที่เป็นหัวข้อตัวหนังสือ (ถ้ามี)
                        if(isNaN(id)) continue; 

                        let pin = row[1] ? String(row[1]).trim() : "1234"; 
                        let name = row[2] ? String(row[2]).trim() : "ไม่มีชื่อ";
                        let info = row[3] ? String(row[3]).trim() : "-";
                        
                        if(!sData[id]){
                            let tasks = []; 
                            for(let j=1; j<=7; j++) tasks.push({w:`W${j}`, text:`งานที่ ${j}`, completed: false});
                            sData[id] = {id, pin, name, info, submitted: 0, pending: 7, tasks: tasks};
                            count++;
                        }
                    }
                    if(count > 0) { 
                        saveData(); 
                        updateRoomSelector();
                        Swal.fire('สำเร็จ!', `นำเข้านักเรียนเรียบร้อย ${count} คน`, 'success'); 
                    } else { 
                        Swal.fire('แจ้งเตือน', 'ไม่พบรายชื่อใหม่ หรือรูปแบบไฟล์ไม่ถูกต้อง', 'info'); 
                    }
                } catch (error) { 
                    Swal.fire('ข้อผิดพลาด', 'ไฟล์ไม่ถูกต้องหรือเกิดข้อผิดพลาดในการอ่าน', 'error'); 
                }
                document.getElementById('excel-upload').value = "";
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
